name: MotoGo iOS App Store Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      APPLE_TEAM_ID: 837DURTJ6M
      APPLE_BUNDLE_ID: com.webdevsolutions.motogo

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # FLUTTER
      # =========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      # =========================================================
      # COCOAPODS
      # =========================================================

      - name: Install CocoaPods
        run: |
          set -e

          sudo gem install cocoapods

          pod --version

      # =========================================================
      # CLEAN
      # =========================================================

      - name: Clean Flutter
        run: |
          set -e

          flutter clean
          flutter pub get

          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

      # =========================================================
      # POD INSTALL
      # =========================================================

      - name: Install Pods
        working-directory: ios
        run: |
          set -e

          pod install --repo-update

      # =========================================================
      # CERTIFICATE
      # =========================================================

      - name: Create signing keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

        run: |
          set -e

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          CERT="$RUNNER_TEMP/MotoGo_Distribution.p12"
          KEYCHAIN_PASSWORD="github-actions"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security import \
            "$CERT" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN"

          security default-keychain \
            -s "$KEYCHAIN"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          echo "Keychain configurado."

      # =========================================================
      # VERIFY CERTIFICATE
      # =========================================================

      - name: Verify certificate
        run: |
          set -e

          echo "=========================================="
          echo "CERTIFICADOS DE ASSINATURA"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

      # =========================================================
      # PROVISIONING PROFILE
      # =========================================================

      - name: Install App Store Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}

        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_FILE="$RUNNER_TEMP/MotoGo_App_Store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          mkdir -p "$PROFILE_DIR"

          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_FILE"

          security cms \
            -D \
            -i "$PROFILE_FILE" \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$PROFILE_PLIST"
          )

          APS_ENVIRONMENT=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:aps-environment" \
              "$PROFILE_PLIST" \
              2>/dev/null || true
          )

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "PROVISIONING PROFILE"
          echo "=========================================="

          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "App ID: $PROFILE_APP_ID"
          echo "Team ID: $PROFILE_TEAM_ID"
          echo "Push Notifications: $APS_ENVIRONMENT"

          # -----------------------------------------------------
          # VALIDATE TEAM
          # -----------------------------------------------------

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo ""
            echo "ERRO: Team ID do provisioning profile incorreto."
            echo "Esperado: $APPLE_TEAM_ID"
            echo "Encontrado: $PROFILE_TEAM_ID"
            exit 1
          fi

          # -----------------------------------------------------
          # VALIDATE BUNDLE ID
          # -----------------------------------------------------

          EXPECTED_APP_ID="$APPLE_TEAM_ID.$APPLE_BUNDLE_ID"

          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo ""
            echo "ERRO: Bundle ID do provisioning profile incorreto."
            echo "Esperado: $EXPECTED_APP_ID"
            echo "Encontrado: $PROFILE_APP_ID"
            exit 1
          fi

          # -----------------------------------------------------
          # VALIDATE PUSH NOTIFICATIONS
          # -----------------------------------------------------

          if [ -z "$APS_ENVIRONMENT" ]; then
            echo ""
            echo "ERRO: O provisioning profile não possui"
            echo "aps-environment."
            echo ""
            echo "Regere o App Store Provisioning Profile"
            echo "com Push Notifications habilitado."
            exit 1
          fi

          # -----------------------------------------------------
          # INSTALL PROFILE
          # -----------------------------------------------------

          cp \
            "$PROFILE_FILE" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo ""
          echo "Provisioning profile instalado com sucesso."

      # =========================================================
      # INSTALL XCODEPROJ GEM
      # =========================================================

      - name: Install xcodeproj
        run: |
          set -e

          sudo gem install xcodeproj --no-document

          ruby -e 'require "xcodeproj"; puts Xcodeproj::VERSION'

      # =========================================================
      # CONFIGURE ONLY RUNNER TARGET
      # =========================================================

      - name: Configure Runner signing
        env:
          PROFILE_UUID: ${{ env.PROFILE_UUID }}

        run: |
          set -e

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/Runner.xcodeproj'

          team_id = ENV.fetch('APPLE_TEAM_ID')
          profile_uuid = ENV.fetch('PROFILE_UUID')

          project = Xcodeproj::Project.open(project_path)

          runner = project.targets.find do |target|
            target.name == 'Runner'
          end

          unless runner
            abort 'ERRO: Target Runner não encontrado.'
          end

          release_config = runner.build_configurations.find do |config|
            config.name == 'Release'
          end

          unless release_config
            abort 'ERRO: Configuração Release do Runner não encontrada.'
          end

          settings = release_config.build_settings

          # -----------------------------------------------------
          # SOMENTE TARGET RUNNER
          # -----------------------------------------------------

          settings['CODE_SIGN_STYLE'] = 'Manual'
          settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          settings['DEVELOPMENT_TEAM'] = team_id
          settings['PROVISIONING_PROFILE_SPECIFIER'] = profile_uuid
          settings['CODE_SIGNING_ALLOWED'] = 'YES'
          settings['CODE_SIGNING_REQUIRED'] = 'YES'

          # -----------------------------------------------------
          # ENTITLEMENTS
          # -----------------------------------------------------

          entitlements_path = 'ios/Runner/Runner.entitlements'

          if File.exist?(entitlements_path)
            settings['CODE_SIGN_ENTITLEMENTS'] = 'Runner/Runner.entitlements'
          end

          project.save

          puts ''
          puts '=========================================='
          puts 'RUNNER CONFIGURADO'
          puts '=========================================='
          puts "Target: Runner"
          puts "Configuration: Release"
          puts "Team ID: #{team_id}"
          puts "Profile UUID: #{profile_uuid}"
          puts 'Signing Style: Manual'
          puts 'Signing Identity: Apple Distribution'
          puts ''
          puts 'Provisioning profile aplicado SOMENTE ao Runner.'
          RUBY

      # =========================================================
      # VERIFY RUNNER SETTINGS
      # =========================================================

      - name: Verify Runner signing settings
        run: |
          set -e

          echo "=========================================="
          echo "RUNNER SIGNING SETTINGS"
          echo "=========================================="

          xcodebuild \
            -project ios/Runner.xcodeproj \
            -target Runner \
            -configuration Release \
            -showBuildSettings \
            | grep -E \
              'PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_ENTITLEMENTS|CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED' \
              || true

      # =========================================================
      # VERIFY PODFILE SIGNING
      # =========================================================

      - name: Verify Pods signing configuration
        run: |
          set -e

          echo "=========================================="
          echo "PODFILE"
          echo "=========================================="

          if [ -f ios/Podfile ]; then
            grep -n \
              -E \
              'CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM' \
              ios/Podfile \
              || true
          else
            echo "Aviso: ios/Podfile não encontrado."
          fi

      # =========================================================
      # FLUTTER BUILD
      # =========================================================

      - name: Build Flutter iOS
        run: |
          set -e

          flutter build ios \
            --release \
            --no-codesign

      # =========================================================
      # ARCHIVE
      # =========================================================

      - name: Archive iOS App
        run: |
          set -e
          set -o pipefail

          mkdir -p build/ios/archive

          echo "=========================================="
          echo "CRIANDO ARCHIVE"
          echo "=========================================="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            archive

      # =========================================================
      # VERIFY ARCHIVE
      # =========================================================

      - name: Verify Archive
        run: |
          set -e

          ARCHIVE="build/ios/archive/Runner.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERRO: Archive não foi criado."
            exit 1
          fi

          echo "=========================================="
          echo "ARCHIVE CRIADO"
          echo "=========================================="

          ls -lah "$ARCHIVE"

      # =========================================================
      # EXPORT OPTIONS
      # =========================================================

      - name: Create ExportOptions.plist
        run: |
          set -e

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${APPLE_BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          echo "=========================================="
          echo "ExportOptions.plist criado."
          echo "=========================================="

          cat ios/ExportOptions.plist

      # =========================================================
      # EXPORT IPA
      # =========================================================

      - name: Export IPA
        run: |
          set -e
          set -o pipefail

          mkdir -p build/ios/ipa

          echo "=========================================="
          echo "EXPORTANDO IPA"
          echo "=========================================="

          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ios/ipa" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ios/ExportOptions.plist"

      # =========================================================
      # VERIFY IPA
      # =========================================================

      - name: Verify IPA
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" -type f | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERRO: IPA não foi criado."
            exit 1
          fi

          echo "=========================================="
          echo "IPA CRIADO COM SUCESSO"
          echo "=========================================="

          ls -lh "$IPA"

      # =========================================================
      # VERIFY IPA SIGNING
      # =========================================================

      - name: Verify IPA signing
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" -type f | head -n 1)

          CHECK_DIR="$RUNNER_TEMP/ipa-check"

          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"

          unzip -q \
            "$IPA" \
            -d "$CHECK_DIR"

          APP=$(find \
            "$CHECK_DIR/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERRO: APP não encontrado dentro do IPA."
            exit 1
          fi

          echo "=========================================="
          echo "APP"
          echo "=========================================="

          echo "$APP"

          echo ""
          echo "=========================================="
          echo "ASSINATURA"
          echo "=========================================="

          codesign \
            -dv \
            --verbose=4 \
            "$APP" \
            2>&1

          echo ""
          echo "=========================================="
          echo "ENTITLEMENTS"
          echo "=========================================="

          codesign \
            -d \
            --entitlements :- \
            "$APP" \
            2>/dev/null || true

      # =========================================================
      # VERIFY BUNDLE ID
      # =========================================================

      - name: Verify Bundle ID
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" -type f | head -n 1)

          CHECK_DIR="$RUNNER_TEMP/bundle-check"

          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"

          unzip -q \
            "$IPA" \
            -d "$CHECK_DIR"

          APP=$(find \
            "$CHECK_DIR/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERRO: APP não encontrado."
            exit 1
          fi

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Info.plist"
          )

          echo "=========================================="
          echo "BUNDLE ID"
          echo "=========================================="

          echo "Encontrado: $BUNDLE_ID"
          echo "Esperado:   $APPLE_BUNDLE_ID"

          if [ "$BUNDLE_ID" != "$APPLE_BUNDLE_ID" ]; then
            echo ""
            echo "ERRO: Bundle ID incorreto."
            exit 1
          fi

          echo ""
          echo "Bundle ID correto."

      # =========================================================
      # UPLOAD IPA ARTIFACT
      # =========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-App-Store-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # UPLOAD ARCHIVE ARTIFACT
      # =========================================================

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-App-Store-Archive
          path: build/ios/archive/Runner.xcarchive
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # CLEANUP
      # =========================================================

      - name: Cleanup signing keychain
        if: always()
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/build.keychain-db" \
            || true
