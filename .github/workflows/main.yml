name: MotoGo iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter --version

      - name: Instalar dependências Flutter
        run: flutter pub get

      - name: Instalar CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Instalar pods do iOS
        working-directory: ios
        run: pod install --repo-update

      - name: Verificar projeto
        run: flutter doctor -v

      - name: Build iOS sem assinatura
        run: |
          flutter build ios --release --no-codesign

      - name: Garantir build sem assinatura
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verificar aplicativo
        run: |
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Runner.app não foi encontrado."
            exit 1
          fi

          echo "Runner.app encontrado com sucesso."

      - name: Salvar aplicativo iOS
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-build
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
