name: MotoGo iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter --version

      - name: Instalar dependências Flutter
        run: flutter pub get

      - name: Instalar CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Instalar pods do iOS
        working-directory: ios
        run: pod install --repo-update

      - name: Verificar projeto
        run: flutter doctor -v

      - name: Build iOS Simulator
        run: |
          flutter build ios --simulator --debug

      - name: Verificar aplicativo
        run: |
          if [ ! -d "build/ios/iphonesimulator/Runner.app" ]; then
            echo "ERRO: Runner.app não foi encontrado."
            exit 1
          fi

          echo "========================================"
          echo "MotoGo iOS Simulator build criado!"
          echo "========================================"

      - name: Salvar aplicativo iOS
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-Simulator
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
