name: MotoGo iOS App Store Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout do projeto
        uses: actions/checkout@v4

      # ==========================================
      # 2. Flutter
      # ==========================================
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter --version

      # ==========================================
      # 3. Dependências
      # ==========================================
      - name: Instalar dependências Flutter
        run: flutter pub get

      # ==========================================
      # 4. CocoaPods
      # ==========================================
      - name: Instalar CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Instalar Pods
        working-directory: ios
        run: |
          pod install --repo-update

      # ==========================================
      # 5. Criar Keychain
      # ==========================================
      - name: Preparar certificado Apple
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

        run: |

          echo "$CERTIFICATE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/MotoGo_Distribution.p12"

          security create-keychain \
            -p "github-actions" \
            "$RUNNER_TEMP/build.keychain-db"

          security set-keychain-settings \
            -lut 21600 \
            "$RUNNER_TEMP/build.keychain-db"

          security unlock-keychain \
            -p "github-actions" \
            "$RUNNER_TEMP/build.keychain-db"

          security import \
            "$RUNNER_TEMP/MotoGo_Distribution.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$RUNNER_TEMP/build.keychain-db"

          security list-keychains \
            -d user \
            -s "$RUNNER_TEMP/build.keychain-db"

          security default-keychain \
            -s "$RUNNER_TEMP/build.keychain-db"

          security unlock-keychain \
            -p "github-actions" \
            "$RUNNER_TEMP/build.keychain-db"

      # ==========================================
      # 6. Instalar Provisioning Profile
      # ==========================================
      - name: Instalar Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}

        run: |

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$PROFILE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/MotoGo_App_Store_2026.mobileprovision"

          cp \
            "$RUNNER_TEMP/MotoGo_App_Store_2026.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/MotoGo_App_Store_2026.mobileprovision"

      # ==========================================
      # 7. Verificar certificado
      # ==========================================
      - name: Verificar certificado Apple
        run: |

          echo "========================================"
          echo "CERTIFICADOS DISPONÍVEIS"
          echo "========================================"

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

      # ==========================================
      # 8. Verificar Provisioning Profile
      # ==========================================
      - name: Verificar Provisioning Profile
        run: |

          security cms \
            -D \
            -i "$RUNNER_TEMP/MotoGo_App_Store_2026.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          echo "========================================"
          echo "PROVISIONING PROFILE"
          echo "========================================"

          echo "Nome:"
          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"

          echo "Team:"
          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"

          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"

          echo "Push Notifications:"
          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:aps-environment" \
            "$RUNNER_TEMP/profile.plist"

      # ==========================================
      # 9. Limpar Flutter
      # ==========================================
      - name: Limpar projeto Flutter
        run: |

          flutter clean
          flutter pub get

      # ==========================================
      # 10. Garantir configuração de assinatura
      # ==========================================
      - name: Configurar assinatura do Runner
        shell: bash
        run: |

          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")

          text = path.read_text()

          # Team
          text = text.replace(
              "DEVELOPMENT_TEAM = 837DURTJ6M;",
              "DEVELOPMENT_TEAM = 837DURTJ6M;"
          )

          path.write_text(text)

          print("Configuração do projeto verificada.")
          PY

      # ==========================================
      # 11. Build Flutter sem assinatura
      # ==========================================
      - name: Build Flutter iOS
        run: |

          flutter build ios \
            --release \
            --no-codesign

      # ==========================================
      # 12. Criar ExportOptions.plist
      # ==========================================
      - name: Criar ExportOptions.plist
        run: |

          cat > ios/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>837DURTJ6M</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.webdevsolutions.motogo</key>
                  <string>MotoGo_App_Store_2026</string>
              </dict>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist criado:"
          cat ios/ExportOptions.plist

      # ==========================================
      # 13. Configurar CODE SIGNING dos Pods
      # ==========================================
      - name: Desativar assinatura dos Pods
        run: |

          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/Podfile")

          text = path.read_text()

          if "CODE_SIGNING_ALLOWED" not in text:
              text = text.rstrip() + """

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)

              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGNING_IDENTITY'] = ''
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              end
            end
          end
          """

          path.write_text(text)

          print("Pods configurados para não assinar.")
          PY

          cd ios
          pod install

      # ==========================================
      # 14. Criar Archive
      # ==========================================
      - name: Criar Archive iOS
        run: |

          mkdir -p build/ios/archive

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=837DURTJ6M \
            archive

      # ==========================================
      # 15. Verificar Archive
      # ==========================================
      - name: Verificar Archive
        run: |

          if [ ! -d "build/ios/archive/Runner.xcarchive" ]; then
            echo "ERRO: Archive não foi criado."
            exit 1
          fi

          echo "========================================"
          echo "ARCHIVE CRIADO"
          echo "========================================"

          ls -lah build/ios/archive/

      # ==========================================
      # 16. Exportar IPA
      # ==========================================
      - name: Exportar IPA
        run: |

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ios/ipa" \
            -exportOptionsPlist ios/ExportOptions.plist

      # ==========================================
      # 17. Verificar IPA
      # ==========================================
      - name: Verificar IPA
        run: |

          echo "========================================"
          echo "ARQUIVOS GERADOS"
          echo "========================================"

          find build/ios/ipa \
            -maxdepth 2 \
            -type f \
            -print

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERRO: IPA não foi criado."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "MOTO GO IPA CRIADO!"
          echo "========================================"
          echo "$IPA"

      # ==========================================
      # 18. Verificar assinatura
      # ==========================================
      - name: Verificar assinatura do IPA
        run: |

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          mkdir -p "$RUNNER_TEMP/ipa-check"

          unzip -q \
            "$IPA" \
            -d "$RUNNER_TEMP/ipa-check"

          APP=$(find "$RUNNER_TEMP/ipa-check/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d | head -n 1)

          echo "========================================"
          echo "APP"
          echo "========================================"

          echo "$APP"

          echo "========================================"
          echo "ASSINATURA"
          echo "========================================"

          codesign \
            -dv \
            --verbose=4 \
            "$APP" \
            2>&1 || true

          echo "========================================"
          echo "ENTITLEMENTS"
          echo "========================================"

          codesign \
            -d \
            --entitlements :- \
            "$APP" \
            2>&1 || true

      # ==========================================
      # 19. Upload IPA
      # ==========================================
      - name: Salvar IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 20. Upload Archive
      # ==========================================
      - name: Salvar Archive
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-Archive
          path: build/ios/archive/Runner.xcarchive
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 21. Limpar
      # ==========================================
      - name: Limpar keychain
        if: always()
        run: |

          security delete-keychain \
            "$RUNNER_TEMP/build.keychain-db" \
            || true
