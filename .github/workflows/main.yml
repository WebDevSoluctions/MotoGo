name: MotoGo iOS App Store Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      TEAM_ID: 837DURTJ6M
      BUNDLE_ID: com.webdevsolutions.motogo
      PROFILE_NAME: MotoGo_App_Store_2026

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Flutter
      # =========================================================
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # =========================================================
      # 3. Dependências
      # =========================================================
      - name: Flutter pub get
        run: flutter pub get

      # =========================================================
      # 4. CocoaPods
      # =========================================================
      - name: Instalar CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Pod install
        working-directory: ios
        run: |
          pod install --repo-update

      # =========================================================
      # 5. Keychain
      # =========================================================
      - name: Criar Keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          set -e

          KEYCHAIN="$RUNNER_TEMP/motogo-build.keychain-db"
          P12="$RUNNER_TEMP/MotoGo_Distribution.p12"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$P12"

          security create-keychain \
            -p "github-actions" \
            "$KEYCHAIN"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN"

          security unlock-keychain \
            -p "github-actions" \
            "$KEYCHAIN"

          security import "$P12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN" login.keychain-db

          security default-keychain \
            -s "$KEYCHAIN"

          security unlock-keychain \
            -p "github-actions" \
            "$KEYCHAIN"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "github-actions" \
            "$KEYCHAIN"

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # =========================================================
      # 6. Verificar certificado
      # =========================================================
      - name: Verificar certificado
        run: |
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN"

      # =========================================================
      # 7. Provisioning Profile
      # =========================================================
      - name: Instalar Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          echo "$PROFILE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/profile.mobileprovision"

          security cms \
            -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist")

          NAME=$(/usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist")

          APP_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist")

          TEAM=$(/usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist")

          echo "======================================"
          echo "PROFILE"
          echo "======================================"
          echo "Name: $NAME"
          echo "UUID: $UUID"
          echo "App ID: $APP_ID"
          echo "Team: $TEAM"
          echo "======================================"

          if [ "$TEAM" != "$TEAM_ID" ]; then
            echo "ERRO: Team ID incorreto."
            exit 1
          fi

          if [ "$APP_ID" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "ERRO: Bundle ID incorreto."
            echo "Esperado: $TEAM_ID.$BUNDLE_ID"
            echo "Recebido: $APP_ID"
            exit 1
          fi

          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$PROFILE_DIR/$UUID.mobileprovision"

          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      # =========================================================
      # 8. Verificar Push Notifications
      # =========================================================
      - name: Verificar Push Notifications
        run: |
          echo "======================================"
          echo "ENTITLEMENTS"
          echo "======================================"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements" \
            "$RUNNER_TEMP/profile.plist" || true

          if /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:aps-environment" \
            "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1
          then
            APS=$(/usr/libexec/PlistBuddy \
              -c "Print :Entitlements:aps-environment" \
              "$RUNNER_TEMP/profile.plist")

            echo "Push Notifications: $APS"
          else
            echo "AVISO: aps-environment não está no provisioning profile."
            echo "O build pode funcionar, mas Push Notifications não estará autorizado."
          fi

      # =========================================================
      # 9. Limpar Flutter
      # =========================================================
      - name: Flutter clean
        run: |
          flutter clean
          flutter pub get

      # =========================================================
      # 10. Corrigir assinatura dos Pods
      # =========================================================
      - name: Desativar assinatura dos Pods
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/Podfile")

          text = path.read_text()

          if "CODE_SIGNING_ALLOWED" not in text:
              old = """post_install do |installer|
                installer.pods_project.targets.each do |target|
                  flutter_additional_ios_build_settings(target)
              """

              new = """post_install do |installer|
                installer.pods_project.targets.each do |target|
                  flutter_additional_ios_build_settings(target)

                  target.build_configurations.each do |config|
                    config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                    config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                    config.build_settings['CODE_SIGNING_IDENTITY'] = ''
                    config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
                  end
              """

              if old in text:
                  text = text.replace(old, new)

          path.write_text(text)
          PY

          cat ios/Podfile

      # =========================================================
      # 11. Reinstalar Pods
      # =========================================================
      - name: Reinstalar Pods
        working-directory: ios
        run: |
          rm -rf Pods
          rm -f Podfile.lock
          pod install

      # =========================================================
      # 12. Forçar assinatura manual somente no Runner
      # =========================================================
      - name: Configurar assinatura do Runner
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          replacements = {
              'CODE_SIGN_STYLE = Automatic;': 'CODE_SIGN_STYLE = Manual;',
              'CODE_SIGN_IDENTITY = "Apple Development";': 'CODE_SIGN_IDENTITY = "Apple Distribution";',
              'CODE_SIGN_IDENTITY[sdk=iphoneos*] = "Apple Development";':
                  'CODE_SIGN_IDENTITY[sdk=iphoneos*] = "Apple Distribution";',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text)
          PY

          echo "Configuração do Runner:"
          grep -n \
            -E "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE" \
            ios/Runner.xcodeproj/project.pbxproj || true

      # =========================================================
      # 13. Criar ExportOptions.plist
      # =========================================================
      - name: Criar ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>837DURTJ6M</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.webdevsolutions.motogo</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>compileBitcode</key>
              <false/>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

          </dict>
          </plist>
          EOF

          echo "======================================"
          cat ios/ExportOptions.plist
          echo "======================================"

      # =========================================================
      # 14. Mostrar configurações efetivas
      # =========================================================
      - name: Verificar configuração Xcode
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            | grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            || true

      # =========================================================
      # 15. Build sem assinatura
      # =========================================================
      - name: Flutter build iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign

      # =========================================================
      # 16. Criar Archive
      # =========================================================
      - name: Criar Archive iOS
        run: |
          set -o pipefail

          mkdir -p build/ios/archive

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive \
            | tee "$RUNNER_TEMP/archive.log"

      # =========================================================
      # 17. Verificar Archive
      # =========================================================
      - name: Verificar Archive
        run: |
          if [ ! -d "build/ios/archive/Runner.xcarchive" ]; then
            echo "ERRO: Archive não foi criado."
            exit 1
          fi

          echo "Archive criado:"
          ls -lah build/ios/archive/

      # =========================================================
      # 18. Exportar IPA
      # =========================================================
      - name: Exportar IPA
        run: |
          set -e

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ios/ipa" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ios/ExportOptions.plist"

      # =========================================================
      # 19. Verificar IPA
      # =========================================================
      - name: Verificar IPA
        run: |
          echo "======================================"
          echo "IPA"
          echo "======================================"

          find build/ios/ipa -maxdepth 2 -type f -print

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERRO: IPA não encontrado."
            exit 1
          fi

          echo "IPA encontrado:"
          echo "$IPA"

      # =========================================================
      # 20. Verificar assinatura
      # =========================================================
      - name: Verificar assinatura IPA
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          mkdir -p "$RUNNER_TEMP/ipa-check"

          unzip -q "$IPA" \
            -d "$RUNNER_TEMP/ipa-check"

          APP=$(find \
            "$RUNNER_TEMP/ipa-check/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          echo "======================================"
          echo "APP"
          echo "$APP"
          echo "======================================"

          codesign \
            -dv \
            --verbose=4 \
            "$APP" \
            2>&1 || true

          echo "======================================"
          echo "Entitlements"
          echo "======================================"

          codesign \
            -d \
            --entitlements :- \
            "$APP" \
            2>/dev/null || true

      # =========================================================
      # 21. Upload IPA
      # =========================================================
      - name: Salvar IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 22. Upload Archive
      # =========================================================
      - name: Salvar Archive
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-Archive
          path: build/ios/archive/Runner.xcarchive
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 23. Limpeza
      # =========================================================
      - name: Limpar Keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
