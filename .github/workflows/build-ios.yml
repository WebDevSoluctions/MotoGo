name: MotoGo iOS App Store Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      APPLE_TEAM_ID: 837DURTJ6M
      APPLE_BUNDLE_ID: com.webdevsolutions.motogo

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. FLUTTER
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # =========================================================
      # 3. DEPENDENCIES
      # =========================================================
      - name: Flutter pub get
        run: flutter pub get

      # =========================================================
      # 4. COCOAPODS
      # =========================================================
      - name: Install CocoaPods
        run: |
          set -e
          sudo gem install cocoapods
          pod --version

      # =========================================================
      # 5. CLEAN
      # =========================================================
      - name: Clean Flutter
        run: |
          set -e

          flutter clean
          flutter pub get

          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

      # =========================================================
      # 6. INSTALL PODS
      # =========================================================
      - name: Install Pods
        working-directory: ios
        run: |
          set -e
          pod install --repo-update

      # =========================================================
      # 7. CREATE KEYCHAIN
      # =========================================================
      - name: Create signing keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

        run: |
          set -e

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          CERT="$RUNNER_TEMP/MotoGo_Distribution.p12"
          KEYCHAIN_PASSWORD="github-actions"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security import \
            "$CERT" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN"

          security default-keychain \
            -s "$KEYCHAIN"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          echo "Keychain configurado."

      # =========================================================
      # 8. VERIFY CERTIFICATE
      # =========================================================
      - name: Verify certificate
        run: |
          set -e

          echo "=========================================="
          echo "CERTIFICADOS DISPONIVEIS"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

      # =========================================================
      # 9. INSTALL PROVISIONING PROFILE
      # =========================================================
      - name: Install App Store Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}

        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_FILE="$RUNNER_TEMP/MotoGo_App_Store.mobileprovision"

          mkdir -p "$PROFILE_DIR"

          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_FILE"

          security cms \
            -D \
            -i "$PROFILE_FILE" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_APP_ID=$PROFILE_APP_ID" >> "$GITHUB_ENV"

          cp \
            "$PROFILE_FILE" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "=========================================="
          echo "PROFILE"
          echo "=========================================="
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team: $PROFILE_TEAM_ID"
          echo "App ID: $PROFILE_APP_ID"

          echo ""
          echo "Push Notifications:"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:aps-environment" \
            "$RUNNER_TEMP/profile.plist" \
            || true

      # =========================================================
      # 10. VALIDATE PROFILE
      # =========================================================
      - name: Validate provisioning profile
        run: |
          set -e

          echo "=========================================="
          echo "VALIDANDO PROFILE"
          echo "=========================================="

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "ERRO: Team ID do profile diferente."
            echo "Esperado: $APPLE_TEAM_ID"
            echo "Encontrado: $PROFILE_TEAM_ID"
            exit 1
          fi

          EXPECTED_APP_ID="$APPLE_TEAM_ID.$APPLE_BUNDLE_ID"

          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "ERRO: Application ID incorreto."
            echo "Esperado: $EXPECTED_APP_ID"
            echo "Encontrado: $PROFILE_APP_ID"
            exit 1
          fi

          echo "Team ID correto."
          echo "Bundle ID correto."
          echo "Profile valido."

      # =========================================================
      # 11. REMOVE SIGNING FROM PODS
      # =========================================================
      - name: Configure Pods without signing
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/Podfile")
          text = path.read_text()

          marker = "config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'"

          if marker not in text:
              print("Aviso: configuracao de Pods nao encontrada.")
              print("Continuando...")
          else:
              print("Pods configurados sem assinatura.")
          PY

          cd ios
          pod install
          cd ..

      # =========================================================
      # 12. CONFIGURE ONLY RUNNER SIGNING
      # =========================================================
      - name: Configure Runner signing
        run: |
          set -e

          PROJECT="ios/Runner.xcodeproj/project.pbxproj"

          python3 - "$PROJECT" "$PROFILE_UUID" "$APPLE_TEAM_ID" <<'PY'
          import sys
          import re
          from pathlib import Path

          project_path = Path(sys.argv[1])
          profile_uuid = sys.argv[2]
          team_id = sys.argv[3]

          text = project_path.read_text()

          # -----------------------------------------------------
          # IMPORTANTE:
          # Remover provisioning profile de TODAS as configuracoes
          # para impedir que Firebase, gRPC, GoogleMaps etc.
          # recebam o profile.
          # -----------------------------------------------------

          text = re.sub(
              r'^\s*PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*PROVISIONING_PROFILE\s*=\s*[^;]+;\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # -----------------------------------------------------
          # Remover DEVELOPMENT_TEAM de configuracoes globais.
          # O Runner recebera abaixo.
          # -----------------------------------------------------

          text = re.sub(
              r'^\s*DEVELOPMENT_TEAM\s*=\s*[^;]+;\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # -----------------------------------------------------
          # Encontrar configuracoes Release que possuem o Bundle ID
          # do Runner.
          # -----------------------------------------------------

          blocks = list(re.finditer(
              r'([A-F0-9]{24}) /\* Release \*/ = \{(.*?)\n\s*\};',
              text,
              re.S
          ))

          found = False

          for match in blocks:

              block = match.group(2)

              if "PRODUCT_BUNDLE_IDENTIFIER = com.webdevsolutions.motogo;" not in block:
                  continue

              new_block = block

              # Garantir assinatura manual apenas no Runner Release.

              if "CODE_SIGN_STYLE = Manual;" not in new_block:
                  new_block = (
                      "                    CODE_SIGN_STYLE = Manual;\n"
                      + new_block
                  )

              if "CODE_SIGN_IDENTITY = \"Apple Distribution\";" not in new_block:
                  new_block = (
                      "                    CODE_SIGN_IDENTITY = \"Apple Distribution\";\n"
                      + new_block
                  )

              new_block = (
                  f"                    DEVELOPMENT_TEAM = {team_id};\n"
                  + new_block
              )

              new_block = (
                  f"                    PROVISIONING_PROFILE_SPECIFIER = \"{profile_uuid}\";\n"
                  + new_block
              )

              start = match.start(2)
              end = match.end(2)

              text = text[:start] + new_block + text[end:]

              found = True
              break

          if not found:
              raise SystemExit(
                  "ERRO: configuracao Release do Runner nao encontrada."
              )

          project_path.write_text(text)

          print("==========================================")
          print("RUNNER CONFIGURADO")
          print("==========================================")
          print(f"Team ID: {team_id}")
          print(f"Profile UUID: {profile_uuid}")
          print("Code Sign Style: Manual")
          print("Certificate: Apple Distribution")
          PY

      # =========================================================
      # 13. FORCE DEPENDENCIES TO AUTOMATIC
      # =========================================================
      - name: Fix dependency signing
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("ios/Pods/Pods.xcodeproj/project.pbxproj"),
              Path("ios/Runner.xcodeproj/project.pbxproj")
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              # Nunca deixar provisioning profile nos Pods.
              if "Pods.xcodeproj" in str(path):
                  text = re.sub(
                      r'^\s*PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;\s*$',
                      '                    PROVISIONING_PROFILE_SPECIFIER = "";',
                      text,
                      flags=re.MULTILINE
                  )

                  text = re.sub(
                      r'^\s*PROVISIONING_PROFILE\s*=\s*[^;]+;\s*$',
                      '                    PROVISIONING_PROFILE = "";',
                      text,
                      flags=re.MULTILINE
                  )

              path.write_text(text)

              print(f"Processado: {path}")
          PY

      # =========================================================
      # 14. BUILD FLUTTER
      # =========================================================
      - name: Build Flutter iOS
        run: |
          set -e

          flutter build ios \
            --release \
            --no-codesign

      # =========================================================
      # 15. VERIFY SETTINGS
      # =========================================================
      - name: Verify Xcode settings
        run: |
          set -e

          echo "=========================================="
          echo "RUNNER RELEASE SETTINGS"
          echo "=========================================="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            | grep -E \
              "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGNING_ALLOWED" \
              || true

      # =========================================================
      # 16. ARCHIVE
      # =========================================================
      - name: Archive iOS App
        run: |
          set -e
          set -o pipefail

          mkdir -p build/ios/archive

          echo "=========================================="
          echo "CRIANDO ARCHIVE"
          echo "=========================================="

          echo "Team ID: $APPLE_TEAM_ID"
          echo "Bundle ID: $APPLE_BUNDLE_ID"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            archive

      # =========================================================
      # 17. VERIFY ARCHIVE
      # =========================================================
      - name: Verify Archive
        run: |
          set -e

          ARCHIVE="build/ios/archive/Runner.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERRO: Archive nao foi criado."
            exit 1
          fi

          echo "=========================================="
          echo "ARCHIVE CRIADO COM SUCESSO"
          echo "=========================================="

          ls -lah "$ARCHIVE"

      # =========================================================
      # 18. EXPORT OPTIONS
      # =========================================================
      - name: Create ExportOptions.plist
        run: |
          set -e

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${APPLE_BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          EOF

          cat ios/ExportOptions.plist

      # =========================================================
      # 19. EXPORT IPA
      # =========================================================
      - name: Export IPA
        run: |
          set -e
          set -o pipefail

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ios/ipa" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ios/ExportOptions.plist"

      # =========================================================
      # 20. VERIFY IPA
      # =========================================================
      - name: Verify IPA
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERRO: IPA nao foi criado."
            exit 1
          fi

          echo "=========================================="
          echo "IPA CRIADO COM SUCESSO"
          echo "=========================================="

          ls -lh "$IPA"

      # =========================================================
      # 21. VERIFY IPA SIGNING
      # =========================================================
      - name: Verify IPA signing
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          mkdir -p "$RUNNER_TEMP/ipa-check"

          unzip -q \
            "$IPA" \
            -d "$RUNNER_TEMP/ipa-check"

          APP=$(find \
            "$RUNNER_TEMP/ipa-check/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERRO: APP nao encontrado."
            exit 1
          fi

          echo "=========================================="
          echo "ASSINATURA"
          echo "=========================================="

          codesign \
            -dv \
            --verbose=4 \
            "$APP" \
            2>&1

          echo ""
          echo "=========================================="
          echo "ENTITLEMENTS"
          echo "=========================================="

          codesign \
            -d \
            --entitlements :- \
            "$APP" \
            2>/dev/null || true

      # =========================================================
      # 22. VERIFY BUNDLE ID
      # =========================================================
      - name: Verify Bundle ID
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          mkdir -p "$RUNNER_TEMP/bundle-check"

          unzip -q \
            "$IPA" \
            -d "$RUNNER_TEMP/bundle-check"

          APP=$(find \
            "$RUNNER_TEMP/bundle-check/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Info.plist"
          )

          echo "Bundle ID: $BUNDLE_ID"

          if [ "$BUNDLE_ID" != "$APPLE_BUNDLE_ID" ]; then
            echo "ERRO: Bundle ID incorreto."
            echo "Esperado: $APPLE_BUNDLE_ID"
            echo "Encontrado: $BUNDLE_ID"
            exit 1
          fi

          echo "Bundle ID correto."

      # =========================================================
      # 23. UPLOAD IPA
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-App-Store-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 24. UPLOAD ARCHIVE
      # =========================================================
      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-App-Store-Archive
          path: build/ios/archive/Runner.xcarchive
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 25. CLEAN KEYCHAIN
      # =========================================================
      - name: Cleanup signing keychain
        if: always()
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/build.keychain-db" \
            || true
