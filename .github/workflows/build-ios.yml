name: MotoGo iOS App Store Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter --version

      - name: Instalar dependências Flutter
        run: flutter pub get

      - name: Instalar CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Instalar Pods
        working-directory: ios
        run: pod install --repo-update

      # ==========================================
      # CERTIFICADO APPLE
      # ==========================================

      - name: Criar certificado P12
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/MotoGo_Distribution.p12"

          security create-keychain \
            -p "github-actions" \
            "$RUNNER_TEMP/build.keychain-db"

          security default-keychain \
            -s "$RUNNER_TEMP/build.keychain-db"

          security unlock-keychain \
            -p "github-actions" \
            "$RUNNER_TEMP/build.keychain-db"

          security import "$RUNNER_TEMP/MotoGo_Distribution.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            "$RUNNER_TEMP/build.keychain-db"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "github-actions" \
            "$RUNNER_TEMP/build.keychain-db"

      # ==========================================
      # PROVISIONING PROFILE
      # ==========================================

      - name: Instalar Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$PROFILE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/MotoGo_App_Store.mobileprovision"

          security cms -D \
            -i "$RUNNER_TEMP/MotoGo_App_Store.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"
          )

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          cp "$RUNNER_TEMP/MotoGo_App_Store.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Provisioning Profile:"
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"

      # ==========================================
      # VERIFICAÇÕES
      # ==========================================

      - name: Verificar assinatura Apple
        run: |
          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

      - name: Verificar Bundle ID
        run: |
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Verificar Provisioning Profile
        run: |
          echo "Profile: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"

      # ==========================================
      # EXPORT OPTIONS
      # ==========================================

      - name: Criar ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>837DURTJ6M</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.webdevsolutions.motogo</key>
                  <string>$PROFILE_NAME</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      # ==========================================
      # BUILD IPA
      # ==========================================

      - name: Build iOS IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

      # ==========================================
      # VERIFICAR IPA
      # ==========================================

      - name: Verificar IPA
        run: |
          echo "========================================"
          echo "MotoGo IPA criado com sucesso!"
          echo "========================================"

          ls -lh build/ios/ipa/

          if [ ! -f build/ios/ipa/*.ipa ]; then
            echo "ERRO: IPA não encontrado."
            exit 1
          fi

      # ==========================================
      # SALVAR IPA
      # ==========================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-AppStore
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      # ==========================================
      # LIMPEZA
      # ==========================================

      - name: Limpar chave temporária
        if: always()
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/build.keychain-db" \
            || true