name: MotoGo iOS App Store Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      APPLE_TEAM_ID: 837DURTJ6M
      APPLE_BUNDLE_ID: com.webdevsolutions.motogo

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # =========================================================
      # 3. Dependências
      # =========================================================
      - name: Flutter pub get
        run: flutter pub get

      # =========================================================
      # 4. CocoaPods
      # =========================================================
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Install Pods
        working-directory: ios
        run: pod install --repo-update

      # =========================================================
      # 5. Criar Keychain
      # =========================================================
      - name: Create signing keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          set -e

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/MotoGo_Distribution.p12"

          security create-keychain \
            -p "github-actions" \
            "$RUNNER_TEMP/build.keychain-db"

          security set-keychain-settings \
            -lut 21600 \
            "$RUNNER_TEMP/build.keychain-db"

          security unlock-keychain \
            -p "github-actions" \
            "$RUNNER_TEMP/build.keychain-db"

          security import \
            "$RUNNER_TEMP/MotoGo_Distribution.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$RUNNER_TEMP/build.keychain-db"

          security list-keychains \
            -d user \
            -s "$RUNNER_TEMP/build.keychain-db"

          security default-keychain \
            -s "$RUNNER_TEMP/build.keychain-db"

          security unlock-keychain \
            -p "github-actions" \
            "$RUNNER_TEMP/build.keychain-db"

      # =========================================================
      # 6. Verificar certificado
      # =========================================================
      - name: Verify Apple Distribution certificate
        run: |
          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

      # =========================================================
      # 7. Instalar Provisioning Profile
      # =========================================================
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          echo "$PROFILE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/MotoGo_App_Store.mobileprovision"

          cp \
            "$RUNNER_TEMP/MotoGo_App_Store.mobileprovision" \
            "$PROFILE_DIR/MotoGo_App_Store.mobileprovision"

      # =========================================================
      # 8. Ler dados do Provisioning Profile
      # =========================================================
      - name: Read provisioning profile
        run: |
          set -e

          security cms \
            -D \
            -i "$RUNNER_TEMP/MotoGo_App_Store.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM=$(
            /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"
          )

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Provisioning Profile"
          echo "========================================"
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team: $PROFILE_TEAM"
          echo "App ID: $PROFILE_APP_ID"
          echo "========================================"

          if [ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "ERRO: Team ID do profile não corresponde."
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "$APPLE_TEAM_ID.$APPLE_BUNDLE_ID" ]; then
            echo "ERRO: Bundle ID do provisioning profile não corresponde."
            echo "Esperado: $APPLE_TEAM_ID.$APPLE_BUNDLE_ID"
            echo "Encontrado: $PROFILE_APP_ID"
            exit 1
          fi

      # =========================================================
      # 9. Flutter clean
      # =========================================================
      - name: Flutter clean
        run: |
          flutter clean
          flutter pub get

      # =========================================================
      # 10. Garantir Pods instalados
      # =========================================================
      - name: Reinstall Pods
        working-directory: ios
        run: |
          pod install --repo-update

      # =========================================================
      # 11. Criar ExportOptions.plist
      # =========================================================
      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${APPLE_BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          EOF

          echo "========================================"
          echo "ExportOptions.plist"
          echo "========================================"

          cat ios/ExportOptions.plist

      # =========================================================
      # 12. Verificar projeto Xcode
      # =========================================================
      - name: Check Xcode project
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -showBuildSettings \
            | grep -E \
              "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY" \
              || true

      # =========================================================
      # 13. Criar Archive
      # =========================================================
      - name: Archive iOS App
        run: |
          set -o pipefail

          mkdir -p build/ios/archive

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APPLE_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      # =========================================================
      # 14. Verificar Archive
      # =========================================================
      - name: Verify Archive
        run: |
          set -e

          ARCHIVE="build/ios/archive/Runner.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERRO: Archive não foi criado."
            exit 1
          fi

          echo "Archive criado:"
          ls -lah "$ARCHIVE"

      # =========================================================
      # 15. Exportar IPA
      # =========================================================
      - name: Export IPA
        run: |
          set -e

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ios/ipa" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ios/ExportOptions.plist"

      # =========================================================
      # 16. Verificar IPA
      # =========================================================
      - name: Verify IPA
        run: |
          set -e

          echo "========================================"
          echo "Arquivos gerados"
          echo "========================================"

          find build/ios/ipa \
            -maxdepth 2 \
            -type f \
            -print

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERRO: IPA não foi criado."
            exit 1
          fi

          echo ""
          echo "IPA:"
          echo "$IPA"

      # =========================================================
      # 17. Verificar assinatura
      # =========================================================
      - name: Verify IPA signature
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          mkdir -p "$RUNNER_TEMP/ipa-check"

          unzip -q "$IPA" \
            -d "$RUNNER_TEMP/ipa-check"

          APP=$(find "$RUNNER_TEMP/ipa-check/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          echo "========================================"
          echo "Aplicativo"
          echo "========================================"

          echo "$APP"

          echo ""
          echo "========================================"
          echo "Assinatura"
          echo "========================================"

          codesign \
            -dv \
            --verbose=4 \
            "$APP" \
            2>&1

          echo ""
          echo "========================================"
          echo "Entitlements"
          echo "========================================"

          codesign \
            -d \
            --entitlements :- \
            "$APP" \
            2>/dev/null \
            || true

      # =========================================================
      # 18. Validar Bundle ID
      # =========================================================
      - name: Verify Bundle ID
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          mkdir -p "$RUNNER_TEMP/bundle-check"

          unzip -q "$IPA" \
            -d "$RUNNER_TEMP/bundle-check"

          APP=$(find "$RUNNER_TEMP/bundle-check/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"
          )

          echo "Bundle ID: $BUNDLE_ID"

          if [ "$BUNDLE_ID" != "$APPLE_BUNDLE_ID" ]; then
            echo "ERRO: Bundle ID incorreto."
            exit 1
          fi

      # =========================================================
      # 19. Upload IPA
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-App-Store-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 20. Upload Archive
      # =========================================================
      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-App-Store-Archive
          path: build/ios/archive/Runner.xcarchive
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 21. Limpar Keychain
      # =========================================================
      - name: Cleanup signing keychain
        if: always()
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/build.keychain-db" \
            || true