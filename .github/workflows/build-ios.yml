name: Build MotoGo iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build MotoGo iOS IPA
    runs-on: macos-latest

    env:
      BUNDLE_ID: com.webdevsolutions.motogo
      TEAM_ID: 837DURTJ6M
      PROFILE_NAME: MotoGo App Store
      SCHEME: Runner
      WORKSPACE: ios/Runner.xcworkspace
      ARCHIVE_PATH: ${{ runner.temp }}/MotoGo.xcarchive
      EXPORT_PATH: ${{ runner.temp }}/MotoGo-export

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ============================================================
      # DEPENDÊNCIAS
      # ============================================================

      - name: Flutter pub get
        run: flutter pub get

      - name: Instalar CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Instalar Pods
        working-directory: ios
        run: |
          pod install --repo-update

      # ============================================================
      # IMPORTAR CERTIFICADO APPLE
      # ============================================================

      - name: Instalar certificado Apple Distribution
        env:
          P12_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/motogo_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/motogo-signing.keychain-db"

          echo "$P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import \
            "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # VERIFICAR CERTIFICADO
      # ============================================================

      - name: Verificar certificado Apple Distribution
        run: |
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # ============================================================
      # INSTALAR PROVISIONING PROFILE
      # ============================================================

      - name: Instalar Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          PROFILE_PATH="$RUNNER_TEMP/MotoGo_App_Store.mobileprovision"

          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp \
            "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/MotoGo_App_Store.mobileprovision"

          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # LER DADOS DO PROFILE
      # ============================================================

      - name: Verificar Provisioning Profile
        run: |
          set -e

          security cms -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          echo "========================================"
          echo "Provisioning Profile"
          echo "========================================"

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"

          echo "----------------------------------------"

          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"

          echo "----------------------------------------"

          /usr/libexec/PlistBuddy \
            -c "Print :TeamIdentifier:0" \
            "$RUNNER_TEMP/profile.plist"

          echo "----------------------------------------"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"

          echo "----------------------------------------"

          if /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:aps-environment" \
            "$RUNNER_TEMP/profile.plist" 2>/dev/null; then

            echo "Push Notifications: OK"

          else

            echo "AVISO: profile não possui aps-environment."
            echo "Verifique Push Notifications no App ID da Apple."

          fi

      # ============================================================
      # CORRIGIR ASSINATURA DOS TARGETS FLUTTER
      #
      # O provisioning profile deve ser usado pelo Runner.
      # Dependências como:
      # - flutter_local_notifications
      # - package_info_plus
      # - GoogleDataTransport
      #
      # NÃO devem receber manual provisioning.
      # ============================================================

      - name: Corrigir configuração de assinatura
        shell: bash
        run: |
          set -e

          PROJECT="ios/Runner.xcodeproj/project.pbxproj"

          echo "Corrigindo configuração de assinatura..."

          # Remove configurações de provisioning profile
          # que possam estar no nível global do projeto.
          sed -i '' \
            '/^[[:space:]]*PROVISIONING_PROFILE_SPECIFIER[[:space:]]*=/d' \
            "$PROJECT"

          sed -i '' \
            '/^[[:space:]]*PROVISIONING_PROFILE[[:space:]]*=/d' \
            "$PROJECT"

          echo "Configuração de assinatura preparada."

      # ============================================================
      # CRIAR EXPORT OPTIONS
      # ============================================================

      - name: Criar ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

            <key>method</key>
            <string>app-store</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>teamID</key>
            <string>837DURTJ6M</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>com.webdevsolutions.motogo</key>
              <string>MotoGo App Store</string>
            </dict>

            <key>compileBitcode</key>
            <false/>

            <key>destination</key>
            <string>export</string>

          </dict>
          </plist>
          PLIST

      # ============================================================
      # LIMPAR BUILD
      # ============================================================

      - name: Flutter clean
        run: |
          flutter clean
          flutter pub get

      # ============================================================
      # PODS NOVAMENTE APÓS CLEAN
      # ============================================================

      - name: Reinstalar Pods
        working-directory: ios
        run: |
          pod install --repo-update

      # ============================================================
      # BUILD FLUTTER SEM ASSINATURA
      #
      # Não fazemos flutter build ipa aqui porque queremos
      # controlar a assinatura no archive/export do Xcode.
      # ============================================================

      - name: Build Flutter iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign

      # ============================================================
      # ARCHIVE XCODE
      # ============================================================

      - name: Criar Archive iOS
        run: |
          set -e

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      # ============================================================
      # VERIFICAR ARCHIVE
      # ============================================================

      - name: Verificar Archive
        run: |
          set -e

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERRO: Archive não foi criado."
            exit 1
          fi

          echo "========================================"
          echo "Archive criado com sucesso!"
          echo "========================================"

      # ============================================================
      # EXPORTAR IPA
      # ============================================================

      - name: Exportar IPA
        run: |
          set -e

          rm -rf "$EXPORT_PATH"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ios/ExportOptions.plist

      # ============================================================
      # LOCALIZAR IPA
      # ============================================================

      - name: Verificar IPA
        run: |
          set -e

          echo "Arquivos gerados:"

          find "$EXPORT_PATH" \
            -maxdepth 2 \
            -type f \
            -print

          IPA=$(find "$EXPORT_PATH" -name "*.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERRO: IPA não encontrado."
            exit 1
          fi

          echo "IPA encontrado:"
          echo "$IPA"

          cp "$IPA" "$RUNNER_TEMP/MotoGo.ipa"

      # ============================================================
      # VALIDAR ASSINATURA
      # ============================================================

      - name: Validar assinatura do IPA
        run: |
          set -e

          unzip -q "$RUNNER_TEMP/MotoGo.ipa" \
            -d "$RUNNER_TEMP/ipa-check"

          APP=$(find "$RUNNER_TEMP/ipa-check/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERRO: .app não encontrado dentro do IPA."
            exit 1
          fi

          echo "========================================"
          echo "Bundle:"
          echo "$APP"
          echo "========================================"

          codesign \
            -dvvv \
            "$APP" 2>&1 | grep -E \
            "Identifier|TeamIdentifier|Authority"

      # ============================================================
      # UPLOAD IPA
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-IPA
          path: ${{ runner.temp }}/MotoGo.ipa
          if-no-files-found: error

      # ============================================================
      # UPLOAD ARCHIVE
      # ============================================================

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-Archive
          path: ${{ runner.temp }}/MotoGo.xcarchive
          if-no-files-found: error

      # ============================================================
      # LIMPEZA
      # ============================================================

      - name: Limpar credenciais
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

          rm -f "$RUNNER_TEMP/motogo_distribution.p12"
          rm -f "$RUNNER_TEMP/MotoGo_App_Store.mobileprovision"

          rm -f \
            "$HOME/Library/MobileDevice/Provisioning Profiles/MotoGo_App_Store.mobileprovision" \
            || true
