name: MotoGo iOS App Store Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      APPLE_TEAM_ID: 837DURTJ6M
      APPLE_BUNDLE_ID: com.webdevsolutions.motogo

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. FLUTTER
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # =========================================================
      # 3. DEPENDÊNCIAS
      # =========================================================
      - name: Flutter pub get
        run: flutter pub get

      # =========================================================
      # 4. COCOAPODS
      # =========================================================
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      # =========================================================
      # 5. CRIAR KEYCHAIN
      # =========================================================
      - name: Create signing keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          set -e

          CERT_PATH="$RUNNER_TEMP/MotoGo_Distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="github-actions"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import \
            "$CERT_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Keychain configurado."

      # =========================================================
      # 6. VERIFICAR CERTIFICADO
      # =========================================================
      - name: Verify Apple Distribution certificate
        run: |
          set -e

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

      # =========================================================
      # 7. INSTALAR PROVISIONING PROFILE
      # =========================================================
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$RUNNER_TEMP/MotoGo_App_Store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          mkdir -p "$PROFILE_DIR"

          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_TEAM=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$PROFILE_PLIST"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )

          echo "=========================================="
          echo "PROVISIONING PROFILE"
          echo "=========================================="
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team: $PROFILE_TEAM"
          echo "App ID: $PROFILE_APP_ID"
          echo "=========================================="

          if [ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "ERRO: Team ID incorreto."
            echo "Esperado: $APPLE_TEAM_ID"
            echo "Encontrado: $PROFILE_TEAM"
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "$APPLE_TEAM_ID.$APPLE_BUNDLE_ID" ]; then
            echo "ERRO: Bundle ID incorreto."
            echo "Esperado: $APPLE_TEAM_ID.$APPLE_BUNDLE_ID"
            echo "Encontrado: $PROFILE_APP_ID"
            exit 1
          fi

          cp \
            "$PROFILE_PATH" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo "Provisioning Profile instalado."

      # =========================================================
      # 8. LIMPAR FLUTTER
      # =========================================================
      - name: Flutter clean
        run: |
          flutter clean
          flutter pub get

      # =========================================================
      # 9. LIMPAR E REINSTALAR PODS
      # =========================================================
      - name: Reinstall iOS Pods
        run: |
          set -e

          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

          flutter pub get

          cd ios
          pod install --repo-update
          cd ..

      # =========================================================
      # 10. CONFIGURAR ASSINATURA SOMENTE NO RUNNER
      # =========================================================
      - name: Configure Runner signing
        run: |
          set -e

          PROJECT="ios/Runner.xcodeproj/project.pbxproj"

          echo "=========================================="
          echo "CONFIGURANDO ASSINATURA DO RUNNER"
          echo "=========================================="

          python3 - "$PROJECT" "$PROFILE_UUID" "$APPLE_TEAM_ID" <<'PY'
          import sys
          import re
          from pathlib import Path

          project_path = Path(sys.argv[1])
          profile_uuid = sys.argv[2]
          team_id = sys.argv[3]

          text = project_path.read_text()

          # ---------------------------------------------------------
          # Encontrar o target Runner
          # ---------------------------------------------------------
          runner_target = re.search(
              r'97C146ED1CF9000F007C117D\s*/\* Runner \*/\s*=\s*\{(.*?)\n\s*\};',
              text,
              re.S
          )

          if not runner_target:
              raise SystemExit("ERRO: target Runner não encontrado.")

          runner_block = runner_target.group(1)

          config_list_match = re.search(
              r'buildConfigurationList\s*=\s*([A-F0-9]+)\s*/\* Build configuration list for PBXNativeTarget "Runner"',
              runner_block
          )

          if not config_list_match:
              raise SystemExit(
                  "ERRO: Build configuration list do Runner não encontrada."
              )

          config_list_id = config_list_match.group(1)

          # ---------------------------------------------------------
          # Encontrar a lista de configurações do Runner
          # ---------------------------------------------------------
          config_list_pattern = (
              rf'{re.escape(config_list_id)}\s*/\* Build configuration list '
              rf'for PBXNativeTarget "Runner" \*/\s*=\s*\{{(.*?)\n\s*\}};'
          )

          config_list_match = re.search(
              config_list_pattern,
              text,
              re.S
          )

          if not config_list_match:
              raise SystemExit(
                  "ERRO: configuração do Runner não encontrada."
              )

          config_list_block = config_list_match.group(1)

          release_match = re.search(
              r'([A-F0-9]+)\s*/\* Release \*/',
              config_list_block
          )

          if not release_match:
              raise SystemExit(
                  "ERRO: configuração Release do Runner não encontrada."
              )

          release_id = release_match.group(1)

          # ---------------------------------------------------------
          # Encontrar configuração Release
          # ---------------------------------------------------------
          release_pattern = (
              rf'{re.escape(release_id)}\s*/\* Release \*/\s*=\s*\{{'
              rf'(.*?)\n\s*\}};'
          )

          release_match = re.search(
              release_pattern,
              text,
              re.S
          )

          if not release_match:
              raise SystemExit(
                  "ERRO: bloco Release do Runner não encontrado."
              )

          release_block = release_match.group(1)

          # ---------------------------------------------------------
          # Remover configurações antigas do Runner
          # ---------------------------------------------------------
          release_block = re.sub(
              r'^\s*CODE_SIGN_STYLE\s*=.*?;\s*$',
              '',
              release_block,
              flags=re.M
          )

          release_block = re.sub(
              r'^\s*CODE_SIGN_IDENTITY\s*=.*?;\s*$',
              '',
              release_block,
              flags=re.M
          )

          release_block = re.sub(
              r'^\s*DEVELOPMENT_TEAM\s*=.*?;\s*$',
              '',
              release_block,
              flags=re.M
          )

          release_block = re.sub(
              r'^\s*PROVISIONING_PROFILE_SPECIFIER\s*=.*?;\s*$',
              '',
              release_block,
              flags=re.M
          )

          # ---------------------------------------------------------
          # Adicionar assinatura MANUAL somente ao Runner Release
          # ---------------------------------------------------------
          signing = f'''
                                  CODE_SIGN_STYLE = Manual;
                                  CODE_SIGN_IDENTITY = "Apple Distribution";
                                  DEVELOPMENT_TEAM = {team_id};
                                  PROVISIONING_PROFILE_SPECIFIER = {profile_uuid};
          '''

          release_block = signing + release_block

          # ---------------------------------------------------------
          # Substituir somente o bloco Release encontrado
          # ---------------------------------------------------------
          start, end = release_match.span(1)

          text = (
              text[:start]
              + release_block
              + text[end:]
          )

          project_path.write_text(text)

          print("Runner Release configurado.")
          print(f"Team: {team_id}")
          print(f"Profile UUID: {profile_uuid}")
          print("Signing: Manual")
          print("Certificate: Apple Distribution")
          PY

          echo ""
          echo "=========================================="
          echo "CONFIGURAÇÃO DO XCODE"
          echo "=========================================="

          grep -n \
            -E \
            "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|PRODUCT_BUNDLE_IDENTIFIER" \
            "$PROJECT" || true

      # =========================================================
      # 11. CONFIGURAR PODS SEM ASSINATURA
      # =========================================================
      - name: Disable signing for Pods
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/Podfile")
          text = path.read_text()

          marker = "config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'"

          if marker not in text:

              if not text.rstrip().endswith("end"):
                  raise SystemExit(
                      "ERRO: Podfile possui estrutura inesperada."
                  )

              old = text.rstrip()

              new = old + """

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
                config.build_settings['DEVELOPMENT_TEAM'] = ''
              end
            end
          end
          """

              path.write_text(new)

          print("Podfile configurado para não assinar Pods.")
          PY

          cd ios
          pod install
          cd ..

      # =========================================================
      # 12. BUILD FLUTTER SEM ASSINATURA
      # =========================================================
      - name: Flutter iOS Release no-code-sign
        run: |
          set -e

          flutter build ios \
            --release \
            --no-codesign

      # =========================================================
      # 13. VERIFICAR CONFIGURAÇÃO FINAL DO XCODE
      # =========================================================
      - name: Verify Xcode signing configuration
        run: |
          set -e

          echo "=========================================="
          echo "XCODE BUILD SETTINGS"
          echo "=========================================="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            | grep -E \
              "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
              || true

      # =========================================================
      # 14. CRIAR EXPORTOPTIONS
      # =========================================================
      - name: Create ExportOptions.plist
        run: |
          set -e

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${APPLE_BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          EOF

          echo "=========================================="
          echo "ExportOptions.plist"
          echo "=========================================="

          cat ios/ExportOptions.plist

      # =========================================================
      # 15. ARCHIVE
      # =========================================================
      - name: Archive iOS App
        run: |
          set -e
          set -o pipefail

          mkdir -p build/ios/archive

          echo "=========================================="
          echo "CRIANDO ARCHIVE"
          echo "=========================================="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            archive \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      # =========================================================
      # 16. VERIFICAR ARCHIVE
      # =========================================================
      - name: Verify Archive
        run: |
          set -e

          ARCHIVE="build/ios/archive/Runner.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERRO: Archive não foi criado."
            exit 1
          fi

          echo "=========================================="
          echo "ARCHIVE CRIADO COM SUCESSO"
          echo "=========================================="

          ls -lah "$ARCHIVE"

      # =========================================================
      # 17. EXPORTAR IPA
      # =========================================================
      - name: Export IPA
        run: |
          set -e

          mkdir -p build/ios/ipa

          echo "=========================================="
          echo "EXPORTANDO IPA"
          echo "=========================================="

          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ios/ipa" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ios/ExportOptions.plist"

      # =========================================================
      # 18. VERIFICAR IPA
      # =========================================================
      - name: Verify IPA
        run: |
          set -e

          echo "=========================================="
          echo "ARQUIVOS GERADOS"
          echo "=========================================="

          find build/ios/ipa \
            -maxdepth 2 \
            -type f \
            -print

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERRO: IPA não foi criado."
            exit 1
          fi

          echo ""
          echo "IPA:"
          echo "$IPA"

      # =========================================================
      # 19. VERIFICAR ASSINATURA
      # =========================================================
      - name: Verify IPA signature
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          mkdir -p "$RUNNER_TEMP/ipa-check"

          unzip -q "$IPA" \
            -d "$RUNNER_TEMP/ipa-check"

          APP=$(find "$RUNNER_TEMP/ipa-check/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERRO: APP não encontrado dentro do IPA."
            exit 1
          fi

          echo "=========================================="
          echo "APP"
          echo "=========================================="

          echo "$APP"

          echo ""
          echo "=========================================="
          echo "ASSINATURA"
          echo "=========================================="

          codesign \
            -dv \
            --verbose=4 \
            "$APP" \
            2>&1

          echo ""
          echo "=========================================="
          echo "ENTITLEMENTS"
          echo "=========================================="

          codesign \
            -d \
            --entitlements :- \
            "$APP" \
            2>/dev/null || true

      # =========================================================
      # 20. VALIDAR BUNDLE ID
      # =========================================================
      - name: Verify Bundle ID
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          mkdir -p "$RUNNER_TEMP/bundle-check"

          unzip -q "$IPA" \
            -d "$RUNNER_TEMP/bundle-check"

          APP=$(find "$RUNNER_TEMP/bundle-check/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Info.plist"
          )

          echo "Bundle ID: $BUNDLE_ID"

          if [ "$BUNDLE_ID" != "$APPLE_BUNDLE_ID" ]; then
            echo "ERRO: Bundle ID incorreto."
            exit 1
          fi

          echo "Bundle ID correto."

      # =========================================================
      # 21. UPLOAD IPA
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-App-Store-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 22. UPLOAD ARCHIVE
      # =========================================================
      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-App-Store-Archive
          path: build/ios/archive/Runner.xcarchive
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 23. LIMPAR KEYCHAIN
      # =========================================================
      - name: Cleanup signing keychain
        if: always()
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/build.keychain-db" \
            || true