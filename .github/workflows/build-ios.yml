name: MotoGo iOS App Store Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      APPLE_TEAM_ID: "837DURTJ6M"
      APPLE_BUNDLE_ID: "com.webdevsolutions.motogo"

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. FLUTTER
      # =========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # =========================================================
      # 3. DEPENDÊNCIAS
      # =========================================================

      - name: Flutter pub get
        run: flutter pub get

      # =========================================================
      # 4. COCOAPODS
      # =========================================================

      - name: Install CocoaPods
        run: |
          set -e

          sudo gem install cocoapods
          pod --version

      # =========================================================
      # 5. LIMPAR PROJETO
      # =========================================================

      - name: Clean Flutter
        run: |
          set -e

          flutter clean
          flutter pub get

          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

      # =========================================================
      # 6. INSTALAR PODS
      # =========================================================

      - name: Install Pods
        working-directory: ios
        run: |
          set -e

          pod install --repo-update

      # =========================================================
      # 7. CRIAR KEYCHAIN
      # =========================================================

      - name: Create signing keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

        run: |
          set -e

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          CERT="$RUNNER_TEMP/MotoGo_Distribution.p12"
          KEYCHAIN_PASSWORD="github-actions"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security import \
            "$CERT" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN"

          security default-keychain \
            -s "$KEYCHAIN"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          echo "Keychain configurado."

      # =========================================================
      # 8. VERIFICAR CERTIFICADO
      # =========================================================

      - name: Verify certificate
        run: |
          set -e

          echo "=========================================="
          echo "CERTIFICADOS DISPONIVEIS"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

      # =========================================================
      # 9. INSTALAR PROVISIONING PROFILE
      # =========================================================

      - name: Install App Store Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}

        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_FILE="$RUNNER_TEMP/MotoGo_App_Store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          mkdir -p "$PROFILE_DIR"

          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_FILE"

          echo "=========================================="
          echo "DECODIFICANDO PROVISIONING PROFILE"
          echo "=========================================="

          security cms \
            -D \
            -i "$PROFILE_FILE" \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$PROFILE_PLIST"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )

          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Team ID: $PROFILE_TEAM_ID"
          echo "Application ID: $PROFILE_APP_ID"

          echo "=========================================="
          echo "VERIFICANDO PUSH NOTIFICATIONS"
          echo "=========================================="

          APS_ENVIRONMENT=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:aps-environment" \
              "$PROFILE_PLIST" 2>/dev/null || true
          )

          echo "aps-environment: $APS_ENVIRONMENT"

          if [ -z "$APS_ENVIRONMENT" ]; then
            echo ""
            echo "ERRO: O Provisioning Profile NAO possui"
            echo "Push Notifications (aps-environment)."
            echo ""
            echo "Crie um novo App Store Provisioning Profile"
            echo "para o App ID com Push Notifications habilitado."
            exit 1
          fi

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo ""
            echo "ERRO: Team ID do profile diferente."
            echo "Esperado: $APPLE_TEAM_ID"
            echo "Encontrado: $PROFILE_TEAM_ID"
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "$APPLE_TEAM_ID.$APPLE_BUNDLE_ID" ]; then
            echo ""
            echo "ERRO: Application ID incorreto."
            echo "Esperado: $APPLE_TEAM_ID.$APPLE_BUNDLE_ID"
            echo "Encontrado: $PROFILE_APP_ID"
            exit 1
          fi

          cp \
            "$PROFILE_FILE" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          # IMPORTANTE:
          # Disponibiliza as variáveis para os próximos steps.
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "PROVISIONING PROFILE INSTALADO"
          echo "=========================================="

      # =========================================================
      # 10. GARANTIR QUE PODS NAO SEJAM ASSINADOS
      # =========================================================

      - name: Verify Pod signing configuration
        run: |
          set -e

          echo "=========================================="
          echo "VERIFICANDO PODFILE"
          echo "=========================================="

          grep -n \
            -E \
            "CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            ios/Podfile || true

          echo ""
          echo "Pods serao compilados sem assinatura."

      # =========================================================
      # 11. BUILD FLUTTER SEM ASSINATURA
      # =========================================================

      - name: Build Flutter iOS without signing
        run: |
          set -e

          flutter build ios \
            --release \
            --no-codesign

      # =========================================================
      # 12. CONFIGURAR ASSINATURA DO RUNNER NO ARCHIVE
      # =========================================================

      - name: Configure signing variables
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURACAO DE ASSINATURA"
          echo "=========================================="

          echo "Team ID:"
          echo "$APPLE_TEAM_ID"

          echo ""
          echo "Bundle ID:"
          echo "$APPLE_BUNDLE_ID"

          echo ""
          echo "Profile UUID:"
          echo "$PROFILE_UUID"

          echo ""
          echo "Profile Name:"
          echo "$PROFILE_NAME"

          echo ""
          echo "Certificate:"
          echo "Apple Distribution"

      # =========================================================
      # 13. VERIFICAR BUILD SETTINGS
      # =========================================================

      - name: Verify Xcode configuration
        run: |
          set -e

          echo "=========================================="
          echo "XCODE CONFIGURACAO"
          echo "=========================================="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            | grep -E \
              "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
              || true

      # =========================================================
      # 14. CRIAR ARCHIVE ASSINADO
      # =========================================================

      - name: Archive iOS App
        run: |
          set -e
          set -o pipefail

          ARCHIVE_PATH="$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive"

          mkdir -p "$GITHUB_WORKSPACE/build/ios/archive"

          echo "=========================================="
          echo "CRIANDO ARCHIVE ASSINADO"
          echo "=========================================="

          echo "Team ID: $APPLE_TEAM_ID"
          echo "Bundle ID: $APPLE_BUNDLE_ID"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APPLE_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            archive

      # =========================================================
      # 15. VERIFICAR ARCHIVE
      # =========================================================

      - name: Verify Archive
        run: |
          set -e

          ARCHIVE="$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERRO: Archive nao foi criado."
            exit 1
          fi

          echo "=========================================="
          echo "ARCHIVE CRIADO COM SUCESSO"
          echo "=========================================="

          ls -lah "$ARCHIVE"

      # =========================================================
      # 16. CRIAR EXPORTOPTIONS.PLIST
      # =========================================================

      - name: Create ExportOptions.plist
        run: |
          set -e

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${APPLE_BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          EOF

          echo "=========================================="
          echo "EXPORTOPTIONS.PLIST"
          echo "=========================================="

          cat ios/ExportOptions.plist

      # =========================================================
      # 17. EXPORTAR IPA
      # =========================================================

      - name: Export IPA
        run: |
          set -e
          set -o pipefail

          mkdir -p "$GITHUB_WORKSPACE/build/ios/ipa"

          echo "=========================================="
          echo "EXPORTANDO IPA"
          echo "=========================================="

          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ios/ipa" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ios/ExportOptions.plist"

      # =========================================================
      # 18. VERIFICAR IPA
      # =========================================================

      - name: Verify IPA
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERRO: IPA nao foi criado."
            exit 1
          fi

          echo "=========================================="
          echo "IPA CRIADO COM SUCESSO"
          echo "=========================================="

          ls -lh "$IPA"

      # =========================================================
      # 19. VERIFICAR ASSINATURA
      # =========================================================

      - name: Verify IPA signing
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          mkdir -p "$RUNNER_TEMP/ipa-check"

          unzip -q \
            "$IPA" \
            -d "$RUNNER_TEMP/ipa-check"

          APP=$(find \
            "$RUNNER_TEMP/ipa-check/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERRO: APP nao encontrado."
            exit 1
          fi

          echo "=========================================="
          echo "APLICATIVO"
          echo "=========================================="

          echo "$APP"

          echo ""
          echo "=========================================="
          echo "ASSINATURA"
          echo "=========================================="

          codesign \
            -dv \
            --verbose=4 \
            "$APP" \
            2>&1

          echo ""
          echo "=========================================="
          echo "ENTITLEMENTS"
          echo "=========================================="

          codesign \
            -d \
            --entitlements :- \
            "$APP" \
            2>/dev/null || true

      # =========================================================
      # 20. VALIDAR BUNDLE ID
      # =========================================================

      - name: Verify Bundle ID
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          mkdir -p "$RUNNER_TEMP/bundle-check"

          unzip -q \
            "$IPA" \
            -d "$RUNNER_TEMP/bundle-check"

          APP=$(find \
            "$RUNNER_TEMP/bundle-check/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Info.plist"
          )

          echo "Bundle ID: $BUNDLE_ID"

          if [ "$BUNDLE_ID" != "$APPLE_BUNDLE_ID" ]; then
            echo "ERRO: Bundle ID incorreto."
            echo "Esperado: $APPLE_BUNDLE_ID"
            echo "Encontrado: $BUNDLE_ID"
            exit 1
          fi

          echo "Bundle ID correto."

      # =========================================================
      # 21. UPLOAD IPA
      # =========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-App-Store-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 22. UPLOAD ARCHIVE
      # =========================================================

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-App-Store-Archive
          path: build/ios/archive/Runner.xcarchive
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 23. LIMPAR KEYCHAIN
      # =========================================================

      - name: Cleanup signing keychain
        if: always()
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/build.keychain-db" \
            || true
