name: MotoGo iOS App Store Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      APPLE_TEAM_ID: 837DURTJ6M
      APPLE_BUNDLE_ID: com.webdevsolutions.motogo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods and xcodeproj
        run: |
          set -e
          sudo gem install cocoapods --no-document
          sudo gem install xcodeproj --no-document
          pod --version
          ruby -e 'require "xcodeproj"; puts "xcodeproj OK"'

      - name: Clean Flutter and Pods
        run: |
          set -e
          flutter clean
          flutter pub get
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

      - name: Install Pods
        working-directory: ios
        run: |
          set -e
          pod install --repo-update

      - name: Create signing keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          set -e

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          CERT="$RUNNER_TEMP/MotoGo_Distribution.p12"
          KEYCHAIN_PASSWORD="github-actions"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "Keychain configurado."

      - name: Verify Apple Distribution certificate
        run: |
          set -e

          echo "=========================================="
          echo "CERTIFICADOS DISPONIVEIS"
          echo "=========================================="

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

      - name: Install App Store provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_FILE="$RUNNER_TEMP/MotoGo_App_Store.mobileprovision"

          mkdir -p "$PROFILE_DIR"

          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_FILE"

          security cms -D \
            -i "$PROFILE_FILE" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          APS_ENV=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:aps-environment" \
              "$RUNNER_TEMP/profile.plist" 2>/dev/null || true
          )

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_APP_ID=$PROFILE_APP_ID" >> "$GITHUB_ENV"
          echo "PROFILE_APS_ENV=$APS_ENV" >> "$GITHUB_ENV"

          cp "$PROFILE_FILE" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "=========================================="
          echo "PROFILE"
          echo "=========================================="
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team: $PROFILE_TEAM_ID"
          echo "App ID: $PROFILE_APP_ID"
          echo "Push Notifications: ${APS_ENV:-NAO ENCONTRADO}"

      - name: Compare certificate with provisioning profile
        env:
          PROFILE_PLIST: ${{ runner.temp }}/profile.plist
        run: |
          set -e

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          echo "=========================================="
          echo "CERTIFICADO DO .P12"
          echo "=========================================="

          echo "Identidades de assinatura encontradas:"
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN"

          echo ""
          echo "Detalhes dos certificados no keychain:"
          echo "------------------------------------------"

          security find-certificate \
            -a \
            -Z \
            "$KEYCHAIN" \
            2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "CERTIFICADOS DO PROVISIONING PROFILE"
          echo "=========================================="

          python3 <<'PY'
          import os
          import plistlib
          import subprocess
          import tempfile

          profile_path = os.environ["PROFILE_PLIST"]

          with open(profile_path, "rb") as f:
              plist = plistlib.load(f)

          certificates = plist.get("DeveloperCertificates", [])

          print(f"Quantidade de certificados no profile: {len(certificates)}")

          for index, cert_data in enumerate(certificates, start=1):
              cert_path = None

              try:
                  with tempfile.NamedTemporaryFile(
                      suffix=".cer",
                      delete=False
                  ) as tmp:
                      tmp.write(cert_data)
                      cert_path = tmp.name

                  result = subprocess.run(
                      [
                          "openssl",
                          "x509",
                          "-inform",
                          "DER",
                          "-in",
                          cert_path,
                          "-noout",
                          "-subject",
                          "-issuer",
                          "-serial",
                          "-fingerprint",
                          "-sha256",
                      ],
                      capture_output=True,
                      text=True,
                      check=False,
                  )

                  print("")
                  print(f"--- CERTIFICADO {index} ---")
                  if result.stdout.strip():
                      print(result.stdout.strip())
                  if result.stderr.strip():
                      print(result.stderr.strip())

              finally:
                  if cert_path and os.path.exists(cert_path):
                      os.unlink(cert_path)
          PY

          echo ""
          echo "=========================================="
          echo "VALIDANDO IDENTIDADE DO CERTIFICADO"
          echo "=========================================="

          IDENTITIES="$(security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN" || true)"

          if echo "$IDENTITIES" | grep -q "Apple Distribution"; then
            echo "Apple Distribution encontrada no .p12."
          else
            echo "ERRO: Apple Distribution nao encontrada no .p12."
            echo "O Secret APPSTORE_CERTIFICATES_FILE_BASE64 pode conter"
            echo "um certificado diferente do provisioning profile."
            exit 1
          fi

          echo ""
          echo "Diagnostico concluido."
          echo "Se o certificado listado pelo .p12 nao estiver entre"
          echo "os certificados do provisioning profile, sera necessario"
          echo "regenerar o profile selecionando esse mesmo certificado."

      - name: Validate provisioning profile
        run: |
          set -e

          EXPECTED_APP_ID="$APPLE_TEAM_ID.$APPLE_BUNDLE_ID"

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "ERRO: Team ID do profile diferente."
            echo "Esperado: $APPLE_TEAM_ID"
            echo "Encontrado: $PROFILE_TEAM_ID"
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "ERRO: Application ID incorreto."
            echo "Esperado: $EXPECTED_APP_ID"
            echo "Encontrado: $PROFILE_APP_ID"
            exit 1
          fi

          if [ -z "$PROFILE_APS_ENV" ]; then
            echo "ERRO: O provisioning profile nao possui aps-environment."
            echo "Regere o App Store profile com Push Notifications habilitado."
            exit 1
          fi

          echo "Team ID correto."
          echo "Bundle ID correto."
          echo "Push Notifications configurado."
          echo "Profile valido."

      - name: Verify Podfile signing configuration
        run: |
          set -e

          if ! grep -q "CODE_SIGNING_ALLOWED.*NO" ios/Podfile; then
            echo "ERRO: ios/Podfile nao esta configurado para impedir assinatura dos Pods."
            exit 1
          fi

          echo "Podfile: Pods sem assinatura."

      - name: Build Flutter iOS without signing
        run: |
          set -e
          flutter build ios --release --no-codesign

      # IMPORTANT:
      # Signing is configured AFTER Flutter build so Flutter cannot overwrite it.
      # Only the Runner target receives the provisioning profile.
      - name: Configure ONLY Runner signing after Flutter build
        run: |
          set -e

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find { |t| t.name == 'Runner' }
          raise 'ERRO: target Runner nao encontrado' unless target

          release = target.build_configurations.find { |c| c.name == 'Release' }
          raise 'ERRO: configuracao Release nao encontrada no Runner' unless release

          # Remove manual profile settings from the PROJECT level.
          # This prevents Pods/Swift Package targets from inheriting a profile.
          project.build_configurations.each do |config|
            config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
            config.build_settings.delete('PROVISIONING_PROFILE')
          end

          # Remove profile/team settings from non-Runner targets if present.
          project.targets.each do |other_target|
            next if other_target == target

            other_target.build_configurations.each do |config|
              config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
              config.build_settings.delete('PROVISIONING_PROFILE')
              config.build_settings.delete('DEVELOPMENT_TEAM')
            end
          end

          settings = release.build_settings

          settings['CODE_SIGN_STYLE'] = 'Manual'
          settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
          settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_NAME')
          settings['CODE_SIGNING_ALLOWED'] = 'YES'
          settings['CODE_SIGNING_REQUIRED'] = 'YES'

          if File.exist?('ios/Runner/Runner.entitlements')
            settings['CODE_SIGN_ENTITLEMENTS'] = 'Runner/Runner.entitlements'
          end

          # Keep Debug/Profile automatic so only Release/App Store is manually signed.
          target.build_configurations.each do |config|
            next if config.name == 'Release'

            config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
            config.build_settings.delete('PROVISIONING_PROFILE')
            config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
          end

          project.save

          puts '=========================================='
          puts 'RUNNER RELEASE SIGNING CONFIGURADO'
          puts '=========================================='
          puts "Target: Runner"
          puts "Configuration: Release"
          puts "DEVELOPMENT_TEAM: #{settings['DEVELOPMENT_TEAM']}"
          puts "CODE_SIGN_STYLE: #{settings['CODE_SIGN_STYLE']}"
          puts "CODE_SIGN_IDENTITY: #{settings['CODE_SIGN_IDENTITY']}"
          puts "PROVISIONING_PROFILE_SPECIFIER: #{settings['PROVISIONING_PROFILE_SPECIFIER']}"
          puts "CODE_SIGNING_ALLOWED: #{settings['CODE_SIGNING_ALLOWED']}"
          RUBY

      - name: Verify final Xcode signing settings
        run: |
          set -e

          echo "=========================================="
          echo "FINAL RUNNER RELEASE SETTINGS"
          echo "=========================================="

          SETTINGS="$(xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings)"

          echo "$SETTINGS" | grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGNING_ALLOWED" \
            || true

          echo "$SETTINGS" | grep -q "DEVELOPMENT_TEAM = $APPLE_TEAM_ID" || {
            echo "ERRO: DEVELOPMENT_TEAM nao chegou ao Runner Release."
            exit 1
          }

          echo "$SETTINGS" | grep -q "CODE_SIGN_STYLE = Manual" || {
            echo "ERRO: CODE_SIGN_STYLE nao esta Manual."
            exit 1
          }

          echo "$SETTINGS" | grep -q "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME" || {
            echo "ERRO: provisioning profile nao chegou ao Runner Release."
            exit 1
          }

          echo "$SETTINGS" | grep -q "PRODUCT_BUNDLE_IDENTIFIER = $APPLE_BUNDLE_ID" || {
            echo "ERRO: Bundle ID incorreto no Runner Release."
            exit 1
          }

          echo "Configuracao final OK."

      - name: Archive iOS App
        run: |
          set -e
          set -o pipefail

          mkdir -p build/ios/archive

          echo "=========================================="
          echo "CRIANDO ARCHIVE"
          echo "=========================================="
          echo "Team ID: $APPLE_TEAM_ID"
          echo "Bundle ID: $APPLE_BUNDLE_ID"
          echo "Profile Name: $PROFILE_NAME"

          # Do NOT pass signing/profile arguments globally here.
          # Runner gets its settings from the Xcode project; dependencies stay unsigned.
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            archive

      - name: Verify Archive
        run: |
          set -e

          ARCHIVE="build/ios/archive/Runner.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERRO: Archive nao foi criado."
            exit 1
          fi

          echo "=========================================="
          echo "ARCHIVE CRIADO COM SUCESSO"
          echo "=========================================="

          ls -lah "$ARCHIVE"

      - name: Create ExportOptions.plist
        run: |
          set -e

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${APPLE_BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

              <key>generateAppStoreInformation</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint ios/ExportOptions.plist
          cat ios/ExportOptions.plist

      - name: Export IPA
        run: |
          set -e
          set -o pipefail

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ios/ipa" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ios/ExportOptions.plist"

      - name: Verify IPA
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERRO: IPA nao foi criado."
            exit 1
          fi

          echo "=========================================="
          echo "IPA CRIADO COM SUCESSO"
          echo "=========================================="

          ls -lh "$IPA"

      - name: Verify AppStoreInfo.plist
        run: |
          set -e

          APPSTORE_INFO="build/ios/ipa/AppStoreInfo.plist"

          echo "=========================================="
          echo "VERIFICANDO APPSTOREINFO.PLIST"
          echo "=========================================="

          if [ ! -f "$APPSTORE_INFO" ]; then
            echo "ERRO: AppStoreInfo.plist nao foi gerado."
            echo "Conteudo de build/ios/ipa:"
            ls -lah build/ios/ipa
            exit 1
          fi

          plutil -lint "$APPSTORE_INFO"
          ls -lh "$APPSTORE_INFO"
          echo "AppStoreInfo.plist gerado com sucesso."

      - name: Verify IPA signing
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          mkdir -p "$RUNNER_TEMP/ipa-check"

          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"

          APP=$(find \
            "$RUNNER_TEMP/ipa-check/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERRO: APP nao encontrado."
            exit 1
          fi

          echo "=========================================="
          echo "ASSINATURA"
          echo "=========================================="

          codesign -dv --verbose=4 "$APP" 2>&1

          echo ""
          echo "=========================================="
          echo "ENTITLEMENTS"
          echo "=========================================="

          codesign -d --entitlements :- "$APP" 2>/dev/null || true

      - name: Verify App Version and Build
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" -type f | head -n 1)
          CHECK_DIR="$RUNNER_TEMP/version-check"

          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"

          unzip -q "$IPA" -d "$CHECK_DIR"

          APP=$(find "$CHECK_DIR/Payload" -maxdepth 1 -name "*.app" -type d | head -n 1)

          VERSION=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$APP/Info.plist"
          )

          BUILD=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$APP/Info.plist"
          )

          echo "Version: $VERSION"
          echo "Build: $BUILD"

          if [ "$VERSION" != "1.0.4" ]; then
            echo "ERRO: Versao esperada 1.0.4."
            exit 1
          fi

          if [ "$BUILD" != "5" ]; then
            echo "ERRO: Build esperado 5."
            exit 1
          fi

          echo "Versao e build corretos."

      - name: Verify Bundle ID
        run: |
          set -e

          IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          mkdir -p "$RUNNER_TEMP/bundle-check"

          unzip -q "$IPA" -d "$RUNNER_TEMP/bundle-check"

          APP=$(find \
            "$RUNNER_TEMP/bundle-check/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -n 1)

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Info.plist"
          )

          echo "Bundle ID: $BUNDLE_ID"

          if [ "$BUNDLE_ID" != "$APPLE_BUNDLE_ID" ]; then
            echo "ERRO: Bundle ID incorreto."
            echo "Esperado: $APPLE_BUNDLE_ID"
            echo "Encontrado: $BUNDLE_ID"
            exit 1
          fi

          echo "Bundle ID correto."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-App-Store-IPA
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa/AppStoreInfo.plist
          if-no-files-found: error
          retention-days: 30

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-App-Store-Archive
          path: build/ios/archive/Runner.xcarchive
          if-no-files-found: error
          retention-days: 30


      - name: Upload IPA to App Store Connect
        env:
          APPSTORE_USERNAME: ${{ secrets.APPSTORE_USERNAME }}
          APPSTORE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPSTORE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -e
          set -o pipefail

          if [ -z "$APPSTORE_USERNAME" ]; then
            echo "ERRO: Secret APPSTORE_USERNAME nao configurado."
            exit 1
          fi

          if [ -z "$APPSTORE_APP_SPECIFIC_PASSWORD" ]; then
            echo "ERRO: Secret APPSTORE_APP_SPECIFIC_PASSWORD nao configurado."
            exit 1
          fi

          IPA=$(find build/ios/ipa -name "*.ipa" -type f | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERRO: IPA nao encontrado para upload."
            exit 1
          fi

          echo "=========================================="
          echo "ENVIANDO IPA PARA APP STORE CONNECT"
          echo "=========================================="
          echo "IPA: $IPA"
          echo "Provider: $APPLE_TEAM_ID"

          xcrun iTMSTransporter \
            -m upload \
            -assetFile "$IPA" \
            -u "$APPSTORE_USERNAME" \
            -p "$APPSTORE_APP_SPECIFIC_PASSWORD" \
            -asc_provider "$APPLE_TEAM_ID" \
            -v eXtreme \
            -WONoPause true

      - name: Cleanup signing keychain
        if: always()
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/build.keychain-db" \
            || true
