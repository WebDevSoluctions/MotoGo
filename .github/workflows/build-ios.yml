name: MotoGo iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build MotoGo iOS IPA
    runs-on: macos-latest

    steps:
      # ==========================================
      # 1. Baixar projeto
      # ==========================================
      - name: Checkout do projeto
        uses: actions/checkout@v4

      # ==========================================
      # 2. Configurar Flutter
      # ==========================================
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter --version

      # ==========================================
      # 3. Dependências
      # ==========================================
      - name: Instalar dependências Flutter
        run: flutter pub get

      - name: Instalar CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Instalar Pods
        working-directory: ios
        run: pod install --repo-update

      # ==========================================
      # 4. Criar certificado P12
      # ==========================================
      - name: Preparar certificado Apple
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          set -e

          echo "$CERTIFICATE_BASE64" | base64 --decode > distribution.p12

          security create-keychain \
            -p "$CERTIFICATE_PASSWORD" \
            build.keychain-db

          security set-keychain-settings \
            -lut 21600 \
            build.keychain-db

          security unlock-keychain \
            -p "$CERTIFICATE_PASSWORD" \
            build.keychain-db

          security import distribution.p12 \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k build.keychain-db

          security list-keychains \
            -d user \
            -s build.keychain-db login.keychain-db

          security default-keychain \
            -s build.keychain-db

          security unlock-keychain \
            -p "$CERTIFICATE_PASSWORD" \
            build.keychain-db

          echo "Certificado instalado."

          security find-identity \
            -v \
            -p codesigning \
            build.keychain-db

      # ==========================================
      # 5. Instalar Provisioning Profile
      # ==========================================
      - name: Instalar Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision

          PROFILE_UUID=$(
            security cms -D -i profile.mobileprovision |
            plutil -extract UUID raw -
          )

          PROFILE_NAME=$(
            security cms -D -i profile.mobileprovision |
            plutil -extract Name raw -
          )

          echo "Profile:"
          echo "Nome: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"

          cp profile.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Provisioning Profile instalado."

      # ==========================================
      # 6. Verificar assinatura
      # ==========================================
      - name: Verificar assinatura Apple
        run: |
          echo "Identidades disponíveis:"
          security find-identity -v -p codesigning build.keychain-db

          echo ""
          echo "Provisioning Profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"

      # ==========================================
      # 7. Gerar arquivos Flutter
      # ==========================================
      - name: Preparar projeto iOS
        run: |
          flutter clean
          flutter pub get

          flutter build ios \
            --release \
            --no-codesign

      # ==========================================
      # 8. Criar Archive assinado
      # ==========================================
      - name: Build iOS Archive
        run: |
          set -e

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$PWD/build/ios/MotoGo.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM=837DURTJ6M \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="MotoGo App Store" \
            archive

      # ==========================================
      # 9. Exportar IPA
      # ==========================================
      - name: Criar ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>837DURTJ6M</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.webdevsolutions.motogo</key>
                  <string>MotoGo App Store</string>
              </dict>

              <key>compileBitcode</key>
              <false/>

              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Exportar IPA
        run: |
          set -e

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ios/MotoGo.xcarchive" \
            -exportPath "$PWD/build/ios/ipa" \
            -exportOptionsPlist "$PWD/ExportOptions.plist"

      # ==========================================
      # 10. Verificar IPA
      # ==========================================
      - name: Verificar IPA
        run: |
          echo "========================================"
          echo "Arquivos gerados:"
          echo "========================================"

          find build/ios -type f \
            \( -name "*.ipa" -o -name "*.xcarchive" \) \
            -print

          IPA=$(find build/ios/ipa -name "*.ipa" -type f | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERRO: IPA não foi criado."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "MotoGo IPA criado com sucesso!"
          echo "========================================"
          echo "IPA: $IPA"

      # ==========================================
      # 11. Salvar IPA no GitHub Actions
      # ==========================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      # ==========================================
      # 12. Salvar Archive
      # ==========================================
      - name: Upload Xcode Archive
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-iOS-Archive
          path: build/ios/MotoGo.xcarchive
          if-no-files-found: error

      # ==========================================
      # 13. Limpar certificado
      # ==========================================
      - name: Limpar chave de assinatura
        if: always()
        run: |
          security delete-keychain build.keychain-db || true
          rm -f distribution.p12
          rm -f profile.mobileprovision
