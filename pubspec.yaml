name: motogo
description: Aplicativo de Mototáxi e Delivery

publish_to: "none"

version: 1.0.4+6

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ============================================================
  # HTTP
  # ============================================================

  http: ^1.5.0
  dio: ^5.9.0
  cupertino_icons: ^1.0.8

  # ============================================================
  # UI
  # ============================================================

  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

  # ============================================================
  # ESTADO
  # ============================================================

  provider: ^6.1.5

  # ============================================================
  # OPENSTREETMAP
  # ============================================================

  flutter_map: ^8.3.1
  latlong2: ^0.9.1

  # ============================================================
  # GPS
  # ============================================================

  geolocator: ^14.0.2

  # ============================================================
  # PERMISSÕES
  # ============================================================

  permission_handler: ^12.0.1

  # ============================================================
  # ENDEREÇOS
  # ============================================================

  geocoding: ^4.0.0

  # ============================================================
  # FIREBASE
  # ============================================================

  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  cloud_firestore: ^6.7.1

  # ============================================================
  # ARMAZENAMENTO
  # ============================================================

  shared_preferences: ^2.5.3

  # ============================================================
  # CACHE DE IMAGENS
  # ============================================================

  cached_network_image: ^3.4.1

  # ============================================================
  # LOADING
  # ============================================================

  flutter_spinkit: ^5.2.2

  # ============================================================
  # ÍCONES
  # ============================================================

  font_awesome_flutter: ^10.10.0

  # ============================================================
  # UUID
  # ============================================================

  uuid: ^4.5.1

  # ============================================================
  # GOOGLE MAPS
  # ============================================================

  google_maps_flutter: ^2.18.0
  # Android backend pinned before the JNI/CMake backend change
  google_maps_flutter_android: 2.19.6

  # ============================================================
  # SELEÇÃO DE ARQUIVOS
  # Usado para selecionar comprovantes JPG/PNG
  # ============================================================

  file_picker: ^10.3.3

  # ============================================================
  # LINKS / WHATSAPP
  # ============================================================

  url_launcher: ^6.3.2

  # ============================================================
  # NOTIFICAÇÕES + SOM DE NOVA CORRIDA
  # ============================================================

  audioplayers: ^6.5.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_android: 2.2.23

# ==============================================================
# FLUTTER
# ==============================================================

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/services/
    - assets/icons/
    - assets/lottie/
    - assets/sounds/